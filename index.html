<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniMundos — la casa de las series</title>
<meta name="description" content="MiniMundos: cuatro mundos para tocar, armar y copiar ritmos. Mundo Tambores, Instrumentos, Plantillas y Cubos.">
<meta name="theme-color" content="#050a18">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb347'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%238fb4ff' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<a class="salto" href="#contenido">Saltar al contenido</a>

<!-- Fondo cósmico: estrellas y partículas (canvas 2D, sin WebGL) -->
<canvas id="cosmos" aria-hidden="true"></canvas>

<!-- Cursor linterna mágica: solo desktop -->
<div class="farol" id="farol" aria-hidden="true"></div>

<!-- Marca -->
<header class="marca">
  <svg class="marca__signo" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="8.5" fill="currentColor"/>
    <ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".55" transform="rotate(-20 16 16)"/>
  </svg>
  <span class="marca__texto">
    <b>MiniMundos</b>
    <i>@minimundos.tienda</i>
  </span>
</header>

<!-- Barra de avance del recorrido -->
<div class="barra" aria-hidden="true"><span class="barra__relleno" id="barra"></span></div>

<!-- Aviso opcional (se llena desde AVISO en data.js) -->
<div class="aviso" id="aviso" hidden>
  <p id="avisoTexto"></p>
  <button type="button" id="avisoCerrar" aria-label="Cerrar aviso">×</button>
</div>

<!-- Mapa de mundos -->
<nav class="mapa" aria-label="Mapa de mundos">
  <ol class="mapa__lista" id="mapaLista"></ol>
</nav>

<p class="sr-only" id="vivo" aria-live="polite"></p>

<!-- Escenario: las salas se recorren con scroll horizontal -->
<main class="escenario" id="contenido"></main>

<a class="wafijo" id="wafijo" href="#" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1a11 11 0 0 1-4-2.6 9.4 9.4 0 0 1-2-3.2c-.2-.7-.2-1.3 0-1.8.1-.4.5-.9.8-1.1.2-.2.5-.2.7-.2h.5c.2 0 .4.1.6.5l.8 1.9c.1.2 0 .4-.1.6l-.4.5c-.1.2-.2.3 0 .6a7 7 0 0 0 2.9 2.5c.3.1.4 0 .6-.2l.6-.7c.2-.2.3-.2.6-.1l1.8.9c.3.1.4.3.4.5s0 .8-.2 1.4Z"/></svg>
  <span id="wafijoTexto">Escríbenos</span>
</a>

<noscript>
  <div class="noscript">
    <h1>MiniMundos</h1>
    <p>Esta página necesita JavaScript para mostrar los mundos. Escríbenos a <b>@minimundos.tienda</b>.</p>
  </div>
</noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
